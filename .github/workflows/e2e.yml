name: Playwright E2E Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test-e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: routine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/routine_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/routine_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: test-e2e-secret-key-at-least-32-chars-long
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_PASSWORD: Password123!

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Mock Supabase Schemas, Roles & Realtime
        run: |
          psql "$DATABASE_URL" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS text AS $$
          BEGIN
            RETURN COALESCE(current_setting('request.jwt.claims', true)::jsonb->>'sub', 'test-user-id');
          END;
          $$ LANGUAGE plpgsql;

          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE service_role NOLOGIN;

          CREATE SCHEMA IF NOT EXISTS realtime;
          CREATE TABLE IF NOT EXISTS realtime.messages (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            topic text NOT NULL,
            extension text NOT NULL DEFAULT 'broadcast',
            payload jsonb,
            event text,
            private boolean DEFAULT false,
            updated_at timestamp DEFAULT now(),
            inserted_at timestamp DEFAULT now()
          );
          ALTER TABLE realtime.messages ENABLE ROW LEVEL SECURITY;

          CREATE OR REPLACE FUNCTION realtime.topic() RETURNS text AS $$
          BEGIN
            RETURN COALESCE(current_setting('realtime.topic', true), '');
          END;
          $$ LANGUAGE plpgsql;

          CREATE OR REPLACE FUNCTION realtime.send(payload jsonb, event text, topic text, private boolean DEFAULT false) RETURNS void AS $$
          BEGIN
            RETURN;
          END;
          $$ LANGUAGE plpgsql;

          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'supabase_realtime') THEN
              CREATE PUBLICATION supabase_realtime;
            END IF;
          END $$;
          SQL

      - name: Run database migrations and seed
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
