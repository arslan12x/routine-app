name: Playwright E2E Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test-e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: routine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup database role
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U test_user -d routine_test -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; END \$\$;"

      - name: Run database migrations and seed
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/routine_test?sslmode=disable
          DIRECT_URL: postgresql://test_user:test_password@localhost:5432/routine_test?sslmode=disable
          INITIAL_ADMIN_USERNAME: admin
          INITIAL_ADMIN_EMAIL: admin@routine.local
          INITIAL_ADMIN_PASSWORD: adminpassword123
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Run Playwright tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/routine_test?sslmode=disable
          DIRECT_URL: postgresql://test_user:test_password@localhost:5432/routine_test?sslmode=disable
          BETTER_AUTH_SECRET: test-secret-at-least-thirty-two-chars-long
          BETTER_AUTH_URL: http://localhost:3000
          INITIAL_ADMIN_USERNAME: admin
          INITIAL_ADMIN_EMAIL: admin@routine.local
          INITIAL_ADMIN_PASSWORD: adminpassword123
          TEST_USER_USERNAME: admin
          TEST_USER_PASSWORD: adminpassword123
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
