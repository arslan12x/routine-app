name: Playwright E2E Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test-e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: routine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/routine_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/routine_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Mock Supabase Auth Schema
        run: |
          psql $DATABASE_URL -c "CREATE SCHEMA IF NOT EXISTS auth;"
          psql $DATABASE_URL -c "CREATE OR REPLACE FUNCTION auth.uid() RETURNS text AS \$\$ BEGIN RETURN 'test-user-id'; END; \$\$ LANGUAGE plpgsql;"

      - name: Run database migrations and seed
        run: npx prisma migrate deploy

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
